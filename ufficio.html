<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ufficio — FerApp</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/theme-dark.css">
  <link rel="stylesheet" href="assets/css/ufficio.css">
  <link rel="stylesheet" href="assets/css/banco.css">
  <link rel="stylesheet" href="assets/css/print.css">
  <link rel="stylesheet" href="assets/css/product-card.css">
  <link rel="stylesheet" href="assets/css/price-dot.css">
  <link rel="stylesheet" href="assets/css/invoice.css">
  <style>
    /* Blocco 4 — Fix modale cestino */
    #uffTrashOverlay[hidden] { display: none !important; }

    /* Blocco 4 — Notifica centrale (stile vecchia app) */
    .ferapp-notif-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: ferapp-notif-fade 0.15s ease;
    }
    .ferapp-notif-box {
      background: #1f1f1f;
      border-radius: 12px;
      border-top: 3px solid #4285f4;
      min-width: 420px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      animation: ferapp-notif-pop 0.18s ease;
    }
    .ferapp-notif-box.ferapp-notif-bozza      { border-top-color: #3b82f6; }
    .ferapp-notif-box.ferapp-notif-nuovo      { border-top-color: #eab308; }
    .ferapp-notif-box.ferapp-notif-in_arrivo  { border-top-color: #ef4444; }
    .ferapp-notif-box.ferapp-notif-fatto      { border-top-color: #22c55e; }
    .ferapp-notif-box.ferapp-notif-pronto     { border-top-color: #a855f7; }
    .ferapp-notif-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px 14px;
    }
    .ferapp-notif-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(66, 133, 244, 0.4));
    }
    .ferapp-notif-title {
      flex: 1;
      min-width: 0;
    }
    .ferapp-notif-title-main {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 2px;
      line-height: 1.15;
    }
    .ferapp-notif-title-sub {
      font-size: 0.88rem;
      color: #9ca3af;
      font-weight: 500;
    }
    .ferapp-notif-time {
      font-size: 0.78rem;
      color: #6b7280;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .ferapp-notif-divider {
      height: 2px;
      background: #4285f4;
      margin: 0;
    }
    .ferapp-notif-box.ferapp-notif-bozza .ferapp-notif-divider      { background: #3b82f6; }
    .ferapp-notif-box.ferapp-notif-nuovo .ferapp-notif-divider      { background: #eab308; }
    .ferapp-notif-box.ferapp-notif-in_arrivo .ferapp-notif-divider  { background: #ef4444; }
    .ferapp-notif-box.ferapp-notif-fatto .ferapp-notif-divider      { background: #22c55e; }
    .ferapp-notif-box.ferapp-notif-pronto .ferapp-notif-divider     { background: #a855f7; }
    .ferapp-notif-body {
      padding: 18px 24px;
    }
    .ferapp-notif-line {
      font-size: 0.95rem;
      color: #e5e7eb;
      font-weight: 600;
      line-height: 1.5;
      word-break: break-word;
    }
    .ferapp-notif-actions {
      display: flex;
      gap: 10px;
      padding: 14px 24px 22px;
    }
    .ferapp-notif-btn {
      border: none;
      border-radius: 8px;
      padding: 13px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .ferapp-notif-btn-primary {
      flex: 1;
      background: #4285f4;
      color: #ffffff;
    }
    .ferapp-notif-btn-primary:hover {
      background: #5b9cff;
    }
    .ferapp-notif-box.ferapp-notif-bozza .ferapp-notif-btn-primary           { background: #3b82f6; color: #ffffff; }
    .ferapp-notif-box.ferapp-notif-bozza .ferapp-notif-btn-primary:hover     { background: #60a5fa; }
    .ferapp-notif-box.ferapp-notif-nuovo .ferapp-notif-btn-primary           { background: #eab308; color: #0a0a0a; }
    .ferapp-notif-box.ferapp-notif-nuovo .ferapp-notif-btn-primary:hover     { background: #facc15; }
    .ferapp-notif-box.ferapp-notif-in_arrivo .ferapp-notif-btn-primary       { background: #ef4444; color: #ffffff; }
    .ferapp-notif-box.ferapp-notif-in_arrivo .ferapp-notif-btn-primary:hover { background: #f87171; }
    .ferapp-notif-box.ferapp-notif-fatto .ferapp-notif-btn-primary           { background: #22c55e; color: #0a0a0a; }
    .ferapp-notif-box.ferapp-notif-fatto .ferapp-notif-btn-primary:hover     { background: #4ade80; }
    .ferapp-notif-box.ferapp-notif-pronto .ferapp-notif-btn-primary          { background: #a855f7; color: #ffffff; }
    .ferapp-notif-box.ferapp-notif-pronto .ferapp-notif-btn-primary:hover    { background: #c084fc; }
    .ferapp-notif-btn-secondary:hover {
      background: #444444;
    }
    @keyframes ferapp-notif-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes ferapp-notif-pop {
      from { opacity: 0; transform: scale(0.95) translateY(-10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Flash giallo sull'ordine a cui si scrolla */
    .ferapp-flash {
      animation: ferapp-flash-anim 1.6s ease;
    }
    @keyframes ferapp-flash-anim {
      0%   { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.8); }
      60%  { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0); }
      100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
    }
  </style>
  <style>
    /* Fix: rende l'attributo hidden più forte di .fapp-modal-overlay { display:flex } */
    #uffTrashOverlay[hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="uff-header">
    <div class="uff-header-left">
      <button class="uff-logo" id="uffLogoBtn" title="Cerca articoli, clienti, ordini">
        <span class="uff-logo-icon">⚙</span>
        <div class="uff-logo-text">
          <span class="uff-logo-brand">RATTAZZI</span>
          <span class="uff-logo-sub">CARTELLINI PREZZI</span>
        </div>
      </button>
    </div>
    <div class="uff-header-right">
      <button class="inv-f-btn" id="btnInvoiceNumber" title="Modifica numero bolle">📄 F</button>
      <button class="uff-nav-btn" id="btnTrashUfficio" title="Cestino">🗑 <span id="countCestinoUff">0</span></button>
      <a class="uff-nav-btn" href="banco.html" title="Vai al Banco">🏭 Banco</a>
      <button class="uff-logout" id="uffLogout" title="Esci">🚪</button>
    </div>
  </header>

  <!-- TAB FILTRI -->
  <nav class="uff-tabs">
    <button class="uff-tab is-active" data-filter="nuovi">
      🟡 NUOVI <span class="uff-tab-count" id="countNuovi">0</span>
    </button>
    <button class="uff-tab" data-filter="fatti">
      🟢 FATTI <span class="uff-tab-count" id="countFatti">0</span>
    </button>
    <button class="uff-tab" data-filter="tutti">
      📋 TUTTI <span class="uff-tab-count" id="countTutti">0</span>
    </button>
    <button class="uff-tab" data-filter="pronto">
      🟣 PRONTO <span class="uff-tab-count" id="countPronto">0</span>
    </button>
  </nav>

  <!-- BARRA RICERCA -->
  <div class="uff-searchbar">
    <span class="uff-search-icon">🔍</span>
    <input type="text" id="uffSearch" placeholder="Cerca ordine, cliente, codice articolo…" autocomplete="off">
    <button class="uff-toggle-expand" id="uffToggleExpand" title="Comprimi tutti">
      <span id="uffToggleIcon">📖</span>
    </button>
  </div>

  <!-- LISTA ORDINI -->
  <main class="uff-main">
    <div class="uff-list" id="uffList">
      <!-- Gli ordini verranno iniettati qui dal controller -->
    </div>
  </main>

  <!-- MODALE CESTINO (nascosta di default) -->
  <div id="uffTrashOverlay" class="fapp-modal-overlay" hidden>
    <div class="fapp-modal-box banco-order-view">
      <div class="banco-order-banner" style="background:#7f1d1d;color:#fff;">
        <span>🗑 CESTINO <span id="uffTrashCount">0</span></span>
      </div>
      <div class="banco-order-lines" id="uffTrashList"></div>
      <div class="banco-order-actions">
        <div class="banco-order-actions-row">
          <button class="btn btn-outline" id="uffTrashClose" type="button">Chiudi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { getSession, clearSession } from './js/core/auth.js';
    import { initUfficioController } from './js/ui/controllers/ufficio-controller.js';

    const user = getSession();

    // Se non loggato → login
    if (!user) {
      window.location.href = 'index.html';
    } else {
      // Logout
      document.getElementById('uffLogout').addEventListener('click', () => {
        if (confirm('Uscire?')) {
          clearSession();
          window.location.href = 'index.html';
        }
      });

      // 🆕 Click sul logo → Cassa
      const logoBtn = document.getElementById('uffLogoBtn');
      if (logoBtn) {
        logoBtn.style.cursor = 'pointer';
        logoBtn.addEventListener('click', () => {
          window.location.href = 'cassa.html';
        });
      }

      // Avvia il controller
      initUfficioController(user);
    }
  </script>

</body>
</html>
