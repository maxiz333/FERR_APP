<head>
<meta charset="utf-8">

<title>DDT Rattazzi - compilabile</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ebef; font-family: Arial, Helvetica, sans-serif; }
  .toolbar {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; justify-content: center;
    padding: 10px; background: #fff; border-bottom: 1px solid #d5d8de;
  }
  .toolbar button {
    font: inherit; font-size: 14px; padding: 8px 16px; border: 1px solid #1e3a8a;
    background: #1e3a8a; color: #fff; border-radius: 6px; cursor: pointer;
  }
  .toolbar button.secondary { background: #fff; color: #1e3a8a; }
  .wrap { padding: 16px 8px 32px; }
  .page {
    position: relative; width: min(100%, 900px); margin: 0 auto; background: #fff;
    aspect-ratio: 707 / 1000; container-type: inline-size;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  .page > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }
  .page input { position: absolute; margin: 0; }
  .page input[type=text] {
    padding: 0 .25cqw; border: 0; border-radius: 0; background: transparent; color: #000;
    font-family: Arial, Helvetica, sans-serif; line-height: 1; outline: none;
    text-overflow: clip;
  }
  .page input[type=text]:hover { background: rgba(30, 80, 200, .07); }
  .page input[type=text]:focus { background: rgba(30, 80, 200, .14); }
  .page input.cb {
    -webkit-appearance: none; appearance: none; background: transparent; border: 0;
    cursor: pointer; padding: 0;
  }
  .page input.cb::after {
    content: ""; position: absolute; inset: 14% 14% 14% 14%; opacity: 0;
    background:
      linear-gradient(45deg, transparent 44%, #000 44%, #000 56%, transparent 56%),
      linear-gradient(-45deg, transparent 44%, #000 44%, #000 56%, transparent 56%);
  }
  .page input.cb:checked::after { opacity: 1; }
  .page input.cb:hover { background: rgba(30, 80, 200, .12); }
  .page input.cb:focus-visible { outline: 1px solid #1e50c8; }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .wrap { padding: 0; }
    .page { width: 210mm; height: 297mm; box-shadow: none; aspect-ratio: auto; }
    .page input[type=text]:hover, .page input[type=text]:focus,
    .page input.cb:hover { background: transparent; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
