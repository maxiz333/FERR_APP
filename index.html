<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Rattazzi - Cartellini Prezzi</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/theme-dark.css">
  <link rel="stylesheet" href="assets/css/theme-light.css">
</head>
<body class="login-page">

  <div class="login-container">

    <header class="login-header">
      <div class="brand">
        <div class="brand-logo">
          <span class="brand-icon">⚙️</span>
          <span class="brand-name">RATTAZZI</span>
        </div>
        <p class="brand-sub">CARTELLINI PREZZI</p>
      </div>
    </header>

    <main class="login-main">
      <h1 class="login-title">Seleziona il tuo account</h1>

      <div class="user-list" id="userList">
        <!-- popolato dinamicamente da login-view.js -->
      </div>
     </main>

    <footer class="login-footer">
      <small>FerApp v1.0 — Vanilla JS + Firebase</small>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
